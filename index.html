      // ==========================================
      // WEB AUDIO SYNTH FOR SATISFYING SOUNDS
      // ==========================================
      const playSynthSound = (isSuccess) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (isSuccess) {
            // High pitch ascending chord
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } else {
            // Low pitch heavy buzzer
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          }
        } catch (e) {
          console.log('Audio disabled in sandboxed constraints:', e);
        }
      };

      const LucideIcon = ({ name, className = "w-4 h-4 text-zinc-400" }) => {
        const iconRef = useRef(null);

        useEffect(() => {
          if (window.lucide && iconRef.current) {
            window.lucide.createIcons({
              nodeList: [iconRef.current]
            });
          }
        }, [name]);

        // Fallback names for safety to bypass Lucide camelCase to kebab-case differences
        const kebabName = name
          .replace(/([a-z0-9]|(?=[A-Z]))([A-Z])/g, '$1-$2')
          .toLowerCase();

        return <i ref={iconRef} data-lucide={kebabName} className={className}></i>;
      };

            level: 1,

        const [fillBlankText, setFillBlankText] = useState('');
        const [isAnswerChecked, setIsAnswerChecked] = useState(false);
        const [isAnswerCorrect, setIsAnswerCorrect] = useState(false);
        const [activeChallengeLevel, setActiveChallengeLevel] = useState(null); // level number being studied
        const [failedTries, setFailedTries] = useState(0);

        // App Language shorthand
        const lang = stats.appLanguage || 'pt';
        const t = TRANSLATIONS[lang];

        const triggerNotification = (text, title = 'System') => {
          const id = Date.now();
          setToasts(prev => [...prev, { id, text, title }]);
          setTimeout(() => {
            setToasts(prev => prev.filter(item => item.id !== id));
          }, 4000);
        };

        // Utility to update user statistical parameters
        const updateStats = (newVals) => {
          setStats(prev => ({ ...prev, ...newVals }));
        };

        // Get matching exercises for selected progress track and active level
        const currentTrackExercises = useMemo(() => {
          return INITIAL_EXERCISES.filter(ex => ex.language === selectedLang);
        }, [selectedLang]);

        // Dynamic calculate percentage complete
        const levelsCompletedCount = useMemo(() => {
          const ids = currentTrackExercises.map(ex => ex.id);
          const solved = stats.completedExerciseIds.filter(id => ids.includes(id));
          return solved.length;
        }, [currentTrackExercises, stats.completedExerciseIds]);

        const trackPercentage = useMemo(() => {
          if (currentTrackExercises.length === 0) return 0;
          return Math.round((levelsCompletedCount / currentTrackExercises.length) * 100);
        }, [levelsCompletedCount, currentTrackExercises]);

        // Launch an exercise module
        const startLevelChallenge = (lvlNumber) => {
          if (stats.hearts <= 0) {
            triggerNotification(t.noHearts, 'Alert');
            setActiveTab('shop');
            return;
          }
          // Filter exercises of this level
          const exercisesOfLevel = currentTrackExercises.filter(ex => ex.level === lvlNumber);
          if (exercisesOfLevel.length === 0) {
            triggerNotification(lang === 'pt' ? 'Módulo em construção!' : 'Exercises under development!', 'Info');
            return;
          }
          setActiveChallengeLevel(lvlNumber);
          setCurrentExerciseIdx(0);
          resetExerciseInputs();
        };

        const resetExerciseInputs = () => {
          setSelectedOption('');
          setOrderValue([]);
          setFillBlankText('');
          setIsAnswerChecked(false);
          setIsAnswerCorrect(false);
        };

        // Solve answer handlers
        const handleCheckAnswer = () => {
          const activeExercises = currentTrackExercises.filter(ex => ex.level === activeChallengeLevel);
          const ex = activeExercises[currentExerciseIdx];
          
          let validated = false;
          if (ex.type === ExerciseType.MULTIPLE_CHOICE || ex.type === ExerciseType.CODE_SELECT) {
            validated = (selectedOption === ex.correctAnswer);
          } else if (ex.type === ExerciseType.FILL_IN_BLANKS) {
            validated = (fillBlankText.trim().toLowerCase() === ex.correctAnswer.toLowerCase());
          } else if (ex.type === ExerciseType.ORDER_CODE) {
            const joinedResult = orderValue.join(',');
            validated = (joinedResult === ex.correctAnswer);
          }

          setIsAnswerChecked(true);
          setIsAnswerCorrect(validated);
          playSynthSound(validated);

          if (validated) {
            // Reward XP and gold
            const newXp = stats.xp + ex.xpReward;
            const newGold = stats.gold + Math.ceil(ex.xpReward / 2);
            let updatedCompletedIds = [...stats.completedExerciseIds];
            if (!updatedCompletedIds.includes(ex.id)) {
              updatedCompletedIds.push(ex.id);
            }

            // Achievement unlocking scan
            let newBadges = [...stats.unlockedAchievements];
            if (updatedCompletedIds.length >= 1 && !newBadges.includes('first_steps')) {
              newBadges.push('first_steps');
              triggerNotification(lang === 'pt' ? 'Desbloqueou: Primeiros Passos!' : 'Unlocked Bonus: First Steps!', 'Achievement');
            }
            if (updatedCompletedIds.length >= 10 && !newBadges.includes('code_master')) {
              newBadges.push('code_master');
              triggerNotification('Achievement Unlocked: Code Master!', 'Badge');
            }

            // Estimate Level formula (Every 100 XP unlocks next level)
            const resolvedLevel = Math.floor(newXp / 100) + 1;

            updateStats({
              xp: newXp,
              gold: newGold,
              completedExerciseIds: updatedCompletedIds,
              unlockedAchievements: newBadges,
              level: resolvedLevel
            });
          } else {
            // Deduct heart
            const currentHearts = Math.max(0, stats.hearts - 1);
            updateStats({ hearts: currentHearts });
            if (currentHearts <= 0) {
              triggerNotification(t.noHearts, 'Warning');
            }
          }
        };

        const handleNextExercise = () => {
          const activeExercises = currentTrackExercises.filter(ex => ex.level === activeChallengeLevel);
          if (currentExerciseIdx + 1 < activeExercises.length) {
            setCurrentExerciseIdx(prev => prev + 1);
            resetExerciseInputs();
          } else {
            // Finished level!
            setActiveChallengeLevel(null);
            triggerNotification(t.completeLesson, t.congratsTitle);
          }
        };

        // Spending Gold Coins for refilling Health hearts
        const handleRefillHearts = () => {
          if (stats.gold >= 150) {
            updateStats({

              hearts: 5
            });
            triggerNotification(t.refillSuccess, 'Refill Shop');
          } else {

                    <div className="bg-white/5 p-3 rounded-xl border border-white/5">
                      <p className="text-[9px] text-white/40 uppercase font-black font-mono">{t.practiceTime}</p>
                      <p className="text-md font-bold text-white mt-1">{practiceHistoryMinutes} m</p>
                    </div>
                  </div>
                </div>

                {/* 2. Emerald Leaderboard League list */}
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="font-serif text-sm italic text-white/95">{t.leagueTitle}</h2>
                    <span className="text-[8px] bg-cyan-400/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-400/30 font-extrabold font-mono">{t.remainingDays}</span>
                  </div>
                  
                  <div className="space-y-1.5">
                    {INITIAL_LEADERBOARD.map((user, idx) => (
                      <div key={user.uid} className="flex items-center gap-3 p-2 bg-white/5 border border-white/5 rounded-xl text-xs">
                        <span className="w-4 font-extrabold font-mono text-cyan-400">{idx + 1}</span>
                        <img src={user.avatarUrl} className="w-7 h-7 rounded-full bg-white/5" />
                        <span className="flex-1 font-semibold truncate text-zinc-300 font-mono">{user.displayName}</span>
                        <span className="font-bold text-zinc-100 font-mono text-[10px]">{user.xp} XP</span>
                      </div>
                    ))}

                    {/* Active logged user item */}
                    <div className="flex items-center gap-3 p-2.5 bg-cyan-400/10 border border-cyan-400/30 rounded-xl text-xs shadow-[0_0_12px_rgba(6,182,212,0.1)]">
                      <span className="w-4 font-black font-mono text-cyan-400">4</span>
                      <img src={stats.avatarUrl} className="w-7 h-7 rounded-full bg-white/5" />
                      <span className="flex-1 font-black truncate text-white font-mono">{stats.displayName} (Me)</span>
                      <span className="font-black text-cyan-400 font-mono text-[10px]">{stats.xp} XP</span>
                    </div>
                  </div>
                </div>

                {/* 3. Promotional static Friend challenge panel */}
                <div className="mt-auto friend-promo">
                  <div className="bg-gradient-to-br from-cyan-950/40 to-black p-4 rounded-xl border border-cyan-500/20 space-y-2">
                    <p className="text-[10px] font-bold text-cyan-300 uppercase tracking-widest">{t.friendChallenge}</p>
                    <div className="flex items-center gap-2">
                      <div className="flex -space-x-2">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Anna" className="w-5 h-5 rounded-full ring-2 ring-zinc-950" />
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Marco" className="w-5 h-5 rounded-full ring-2 ring-zinc-950" />
                      </div>
                      <span className="text-[10px] text-zinc-400 font-bold font-mono">{t.friendChallengeDesc}</span>
                    </div>
                    <button 
                      onClick={() => {
                        setActiveTab('duels');
                        triggerNotification('Redirected to the Duel Arena!', 'Game Challenge');
                      }}
                      className="w-full py-1.5 bg-cyan-400 hover:bg-cyan-300 text-black text-[10px] font-black tracking-wider rounded transition-all cursor-pointer"
                    >
                      {t.acceptChallenge}
                    </button>
                  </div>
                </div>
              </aside>
            </div>
            
            {/* RESET PROGRESS / RESET BUTTON FOOTER FOR DEVELOPERS */}
            <footer className="h-10 border-t border-white/5 flex items-center justify-between px-4 text-[9px] font-mono text-zinc-500 bg-black/40 shrink-0">
              <span>Codelingo © 2026 Sandbox • Active Build: Standalone HTML 5</span>
              <button 
                onClick={() => {
                  if (confirm(lang==='pt'?'Deseja apagar o progresso do LocalStorage ?':'Are you sure you want to reset LocalStorage cache progress?')) {
                    localStorage.removeItem('codelingo_stats');
                    window.location.reload();
                  }
                }}
                className="hover:text-red-400 cursor-pointer transition-colors"
              >
                [ RESET ALL PROGRESS ]
              </button>
            </footer>
          </div>
        );
      }

      // ==========================================
      // START THE APP BOOTSTRAP OVER REGULAR DOM
      // ==========================================
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
